name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Haier Remote APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Haier-Smart-TV-Remote-v1.0.1.apk
          echo "APK build complete: build-output/Haier-Smart-TV-Remote-v1.0.1.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haier-Smart-TV-Remote-v1.0.1-APK
          path: build-output/Haier-Smart-TV-Remote-v1.0.1.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Haier Smart TV Remote v1.0.1 (Standalone APK)"
          body: |
            ### Haier Smart TV Remote v1.0.1 - Standalone Mobile Edition
            Official standalone Android APK build for Haier Smart Android TV (LE32K6600G).
            
            Key Highlights:
            - Fully standalone: Connects directly from your mobile phone to your Haier TV via Wi-Fi without needing a laptop or PC.
            - Local UI assets loaded offline from application package.
            - Integrated native Android TV Remote Protocol v2 (TLS ports 6466 and 6467).
            - Automatic Wi-Fi TV discovery: Finds your TV on the local network automatically.
            - Full circular D-pad, Volume and Channel rockers, dedicated YouTube, Netflix, Prime Video, and Google Play buttons.
            - Interactive QWERTY keyboard with real-time text input.
          files: build-output/Haier-Smart-TV-Remote-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
