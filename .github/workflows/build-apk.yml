name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Haier Remote APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Haier-Smart-TV-Remote-v1.0.apk
          echo "APK build complete: build-output/Haier-Smart-TV-Remote-v1.0.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haier-Smart-TV-Remote-v1.0-APK
          path: build-output/Haier-Smart-TV-Remote-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Haier Smart TV Remote v1.0.0 APK"
          body: |
            ### Haier Smart TV Remote v1.0.0
            Official Android APK build for Haier Smart Android TV (LE32K6600G).
            
            - Download `Haier-Smart-TV-Remote-v1.0.apk` below and install directly on your Android phone.
            - Features original circular D-Pad, dedicated Netflix and YouTube shortcuts, full QWERTY keyboard, and volume/channel rockers.
          files: build-output/Haier-Smart-TV-Remote-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
